name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # 与 release.yml 同一把签名（debug keystore），保证 CI 产物可以互相覆盖安装；
      # 不注入时 runner 每次生成随机 debug 签名，产物永远装不到旧包头上
      KEYSTORE_PATH: ${{ github.workspace }}/signing/keystore.jks
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          # 默认缓存键找工作目录根的 go.sum，本仓根目录没有；不指到实际被编译的模块上
          # 就是每次 miss，全量重下 mihomo 的依赖树
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Decode keystore
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug
          path: app/build/outputs/apk/debug/*.apk
          archive: false

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release
          path: app/build/outputs/apk/release/*.apk
          archive: false
