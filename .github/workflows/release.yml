name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # versionCode 来自 git rev-list，必须全量历史
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          # 默认缓存键找工作目录根的 go.sum，本仓根目录没有；不指到实际被编译的模块上
          # 就是每次 miss，全量重下 mihomo 的依赖树
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run native tests
        working-directory: app/src/main/native/mishka_core
        run: go test ./... -count=1

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest -x buildMihomo_arm64_v8a --no-daemon

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Decode keystore
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/mishka-release.jks
          test -s signing/mishka-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/signing/mishka-release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up keystore
        if: ${{ always() }}
        run: rm -f -- "$GITHUB_WORKSPACE/signing/mishka-release.jks"

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          # 正文取 CHANGELOG.md 里 `## <version>` 段落。index 前缀匹配而非正则：
          # 避免 1.1.2 误命中 1.1.20 这类段落头。段落缺失时退回 generate-notes
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            { hdr = "## " ver }
            index($0, hdr) == 1 && (substr($0, length(hdr) + 1, 1) == " " || length($0) == length(hdr)) { hit = 1; next }
            /^## / && hit { exit }
            hit { print }
          ' CHANGELOG.md | sed '/./,$!d' > release_notes.md
          if [ -s release_notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --notes-file release_notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes
          fi
